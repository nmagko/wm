<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32" width="32" height="32">

  <!-- Outer body: black fill, black outline -->
  <rect x="0" y="0" width="32" height="32"
        fill="#000000" stroke="#000000" stroke-width="1"/>

  <!-- Shutter: white fill, black outline -->
  <rect x="9.5" y="1" width="13" height="10.666"
        fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

  <!-- Label area: white fill, black outline -->
  <rect x="2" y="16" width="28" height="13"
        fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

</svg>
